<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio — under construction." />
  <title>Portfolio — Under Construction</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .text {
      width: min(260px, 78vw);
      height: auto;
      display: block;
    }

    .sigil {
      width: min(2.75rem, 22vw);
      height: auto;
      margin-top: 0.25rem;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <img
      class="text"
      src="under construction..svg"
      alt="we’re under construction, will be back very soon :)"
      width="640"
      height="130"
    />
    <img class="sigil" src="sigil_blue.svg" alt="" width="841" height="825" />
  </main>
</body>
</html>
