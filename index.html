<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio — work in progress." />
  <title>Portfolio — Under Construction</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #EBEBEB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: min(1200px, 92vw);
      padding: 2rem;
    }

    .hero {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <img
      class="hero"
      src="under construction..svg"
      alt="Work in progress — Portfolio under construction"
      width="2732"
      height="1937"
    />
  </main>
</body>
</html>
