<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="noor alam" />
  <link rel="icon" href="sigil_orangebg3.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="256x256" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <title>noorslens</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #EBEBEB; /* #EBEBEB */
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: relative;
      min-height: 100dvh;
      width: 100%;
      z-index: 0;
    }

    .confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    :root {
      --text-offset-x: 0px;
      --text-offset-y: -20px;
    }

    .text-anchor {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      transform: translate(calc(-50% + var(--text-offset-x)), calc(-50% + var(--text-offset-y)));
    }

    .text {
      width: min(260px, 78vw);
      height: auto;
      display: block;
    }

    .sigil-wrapper {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 0.40rem;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .sigil {
      display: block;
      width: min(3.5rem, 28vw);
      height: auto;
    }

    .sigil-wrapper.pulse {
      animation: sigil-pulse 0.5s ease-in forwards;
    }

    .sigil-wrapper.pulse .sigil {
      animation: sigil-light 0.5s cubic-bezier(0.25, 0.9, 0.35, 1) forwards;
    }

    .sigil-wrapper.intro-pulse {
      animation: sigil-intro-pulse 0.55s ease-in forwards;
    }

    .sigil-wrapper.intro-pulse .sigil {
      animation: sigil-intro-light 0.55s cubic-bezier(0.25, 0.9, 0.35, 1) forwards;
    }

    @keyframes sigil-pulse {
      10% {
        transform: translateX(-50%) scale(1.1);
      }
      95% {
        transform: translateX(-50%) scale(1);
      }
    }

    @keyframes sigil-intro-pulse {
      10% {
        transform: translateX(-50%) scale(1.16);
      }
      95% {
        transform: translateX(-50%) scale(1);
      }
    }

    @keyframes sigil-light {
      10% {
        filter: brightness(1.15) saturate(1.15);
      }
      55% {
        filter: brightness(1) saturate(1);
      }
    }

    @keyframes sigil-intro-light {
      10% {
        filter: brightness(1.22) saturate(1.2);
      }
      55% {
        filter: brightness(1) saturate(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sigil-wrapper.pulse,
      .sigil-wrapper.pulse .sigil,
      .sigil-wrapper.intro-pulse,
      .sigil-wrapper.intro-pulse .sigil {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="text-anchor">
      <img
        class="text"
        src="under construction..svg"
        alt="we’re under construction, will be back very soon :)"
        width="640"
        height="130"
      />
      <div class="sigil-wrapper">
        <img class="sigil" src="sigil_orangebg3.svg" alt="" width="820" height="681" />
      </div>
    </div>
  </main>
  <canvas class="confetti-canvas"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script>
    const sigilWrapper = document.querySelector('.sigil-wrapper');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Weighted toward blue/orange, with occasional silver and rare black.
    const knicksColors = [
      '#006bb6', '#006bb6', '#006bb6', '#006bb6',
      '#f58426', '#f58426', '#f58426', '#f58426',
      '#bec0c2',
      '#231f20',
    ];
    const fireConfetti = confetti.create(document.querySelector('.confetti-canvas'), {
      resize: true,
      useWorker: true,
    });
    let hasPulsed = false;

    // Warm up the confetti worker so the first burst fires with no delay.
    if (!prefersReducedMotion) {
      fireConfetti({ particleCount: 0 });
    }

    function playPulse(className) {
      hasPulsed = true;
      sigilWrapper.classList.remove('pulse', 'intro-pulse');
      void sigilWrapper.offsetWidth;
      sigilWrapper.classList.add(className);
    }

    function playConfetti() {
      if (prefersReducedMotion) return;

      const duration = 2 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0, colors: knicksColors, scalar: 1.2 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      function burst() {
        const timeLeft = animationEnd - Date.now();
        const particleCount = 50 * (Math.max(timeLeft, 0) / duration);
        fireConfetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        fireConfetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.4, 0.6), y: Math.random() - 0.2 } }));
        fireConfetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }

      // Fire instantly, then keep going for the rest of the duration.
      burst();
      const interval = setInterval(function () {
        if (animationEnd - Date.now() <= 0) {
          return clearInterval(interval);
        }
        burst();
      }, 250);
    }

    function activateSigil(event) {
      if (event.type === 'touchend') {
        event.preventDefault();
      }
      playPulse('pulse');
      playConfetti();
    }

    sigilWrapper.addEventListener('touchend', activateSigil, { passive: false });
    sigilWrapper.addEventListener('click', (event) => {
      if (event.pointerType === 'touch') return;
      activateSigil(event);
    });

    sigilWrapper.addEventListener('animationend', (event) => {
      if (event.target === sigilWrapper) {
        sigilWrapper.classList.remove('pulse', 'intro-pulse');
      }
    });

    if (!prefersReducedMotion) {
      setTimeout(() => {
        if (!hasPulsed) {
          playPulse('intro-pulse');
        }
      }, 550);
    }
  </script>
</body>
</html>
